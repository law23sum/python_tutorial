setup:
  addons:
    - plan: heroku-postgresql
      as: DATABASE
    - plan: heroku-redis
      as: REDIS
  config:
    DJANGO_SETTINGS_MODULE: python_tutorial.settings_production
    DEBUG: false
build:
  docker:
    django: Dockerfile.web
release:
  image: django
  command:
    - python manage.py migrate --noinput
run:
  web:
    command:
      - gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 0 python_tutorial.wsgi:application
    image: django
  worker:
    command:
      - celery -A python_tutorial worker -l INFO --pool threads --concurrency 20
    image: django
  beat:
    command:
      - celery -A python_tutorial beat -l INFO
    image: django
